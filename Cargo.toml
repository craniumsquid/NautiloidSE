[package]
name = "nautiloid-save-editor"
version = "1.3.3"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Save editor for Baldur's Gate 3 (Patch 8)"
readme = "README.md"
# Not for crates.io: the app is shared as builds.
publish = false
# What `cargo run` starts: the editor, not the command-line tool.
default-run = "nautiloid-save-editor"

[[bin]]
name = "nautiloid-save-editor"
path = "src/main.rs"

[[bin]]
name = "nautiloid-cli"
path = "src/bin/nautiloid-cli.rs"

[dependencies]
anyhow = "1"
# LZ4 block and frame: the sections inside .lsf files and the package file list.
lz4_flex = "0.11"
# Zstandard: how Patch 8 stores each file in the .lsv package.
zstd = "0.13"
# zlib: how saves from before Patch 8 store each file (read only).
flate2 = "1"
md-5 = "0.10"
serde_json = "1"
# The interface.
eframe = "0.29"
# The system's folder picker. On Linux it goes through the desktop portal, which needs no
# GTK at build time. async-std, not tokio: with tokio the picker panics unless the app runs
# a tokio runtime, which it doesn't, so choosing a folder closed the app.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# Decodes the .WebP screenshot beside each save.
image = { version = "0.25", default-features = false, features = ["webp"] }

[dev-dependencies]
# Writes the pictures the interface tests take.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

# Puts the icon into the Windows program. Only built on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# The format code is slow without optimizations; this keeps debug builds and tests quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
