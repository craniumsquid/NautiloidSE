name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the app for macOS
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so that a new compiler's lints don't fail a build that passed before.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Real saves are private, so the checks against them skip themselves here.
      - run: cargo test

  # What goes in every download beside the programs: the user guide, docs/HOW-TO-USE.md, as a
  # PDF, and the licences of the libraries and fonts built into the programs. Made on every
  # push, so a change that breaks either shows at once.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      # Printed with the runner's own Chrome.
      - run: python3 packaging/make-guide.py extras
      - run: sh packaging/make-notices.sh extras/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: extras
          path: |
            extras/How to use Nautiloid.pdf
            extras/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 7

  # The app, to download from the run's page. Built for main, for version tags, when the
  # workflow is run by hand, and for any push whose commit message contains [build].
  build:
    name: Build (${{ matrix.name }})
    needs: [test, extras]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          # Not ubuntu-latest: a newer system would make a build that older ones can't run.
          - name: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      # The editor, and the command-line tool for looking inside saves and game files.
      - run: cargo build --release --locked --bins
      - uses: actions/download-artifact@v4
        with:
          name: extras
          path: extras
      - name: Gather the files
        shell: bash
        run: |
          mkdir -p upload files
          cp LICENSE assets/fonts/OFL-*.txt extras/* files/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/nautiloid-save-editor.exe target/release/nautiloid-cli.exe files/
            mv files/* upload/
          else
            # In an archive, so the files stay marked as programs.
            cp target/release/nautiloid-save-editor target/release/nautiloid-cli files/
            tar -czf "upload/nautiloid-save-editor-${{ matrix.name }}.tar.gz" \
              --transform 's,^files,nautiloid-save-editor,' files
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nautiloid-save-editor-${{ matrix.name }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

  # A macOS runner uses ten times the minutes of a Linux one, so this is only built for
  # version tags and when asked for in a run by hand.
  build-macos:
    name: Build (macos-arm64)
    needs: [test, extras]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo build --release --locked --bin nautiloid-save-editor
      - uses: actions/download-artifact@v4
        with:
          name: extras
          path: extras
      - name: Make the app bundle
        run: |
          app="Nautiloid Save Editor.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" upload
          cp target/release/nautiloid-save-editor "$app/Contents/MacOS/"
          cp packaging/macos/Info.plist "$app/Contents/"
          cp packaging/macos/icon.icns "$app/Contents/Resources/"
          cp LICENSE assets/fonts/OFL-*.txt extras/THIRD-PARTY-LICENSES.txt "$app/Contents/Resources/"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" \
            -c "Set :CFBundleVersion $version" \
            "$app/Contents/Info.plist"
          # Signed for this machine only: enough to run, not enough to pass Gatekeeper
          # unasked.
          codesign --force --sign - "$app"
          # The app and the guide, in one folder.
          folder="Nautiloid Save Editor"
          mkdir "$folder"
          mv "$app" "$folder/"
          cp "extras/How to use Nautiloid.pdf" "$folder/"
          ditto -c -k --keepParent "$folder" upload/nautiloid-save-editor-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nautiloid-save-editor-macos-arm64
          path: upload/
          if-no-files-found: error
          retention-days: 30
