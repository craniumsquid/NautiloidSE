# What `cargo about` needs to collect the licences of the libraries built into the app, for
# THIRD-PARTY-LICENSES.txt in each download (see packaging/third-party.hbs).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
# The systems the app is built for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Only what goes into the programs, and not the editor itself, whose licence is LICENSE.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# egui's default fonts ship their licence texts under names cargo-about doesn't look for.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "LicenseRef-UFL-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"
